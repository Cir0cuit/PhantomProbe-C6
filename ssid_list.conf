# ============================================================
# PhantomProbe-C6: Wireless RF Security Research & Telemetry Probe
# Target Hardware: ESP32-C6-DevKitC-1 (Wi-Fi 6 / BLE 5 / IEEE 802.15.4)
# ============================================================
# Declarative deployment manifest for multi-BSSID environment simulation,
# wireless honeypot probing, and BLE accessory reconnaissance research.
# Apply changes instantly with: .\flash_firmware.ps1
#
# Personal settings: copy this file to ssid_list.local.conf and edit the copy. When that
# file exists the build uses it instead of this one, and git ignores it.
#
# Syntax: comments go on their own line. In [networks] and [bluetooth] a whole line is
# taken literally as a name. Put a name in double quotes if it starts with '#', ';', '['
# or a space, for example "#FreeWifi".

[wifi]
# Target 2.4 GHz RF Channel (1 to 13)
# Channels 12 and 13 work only with a country code that permits them (see below);
# otherwise the probe falls back to the first allowed channel and logs an error.
channel = 1

# Optional two-letter regulatory country code (for example NL, DE, PL, GB, US).
# Leave commented to keep the Wi-Fi driver default (world-safe, channels 1-11).
# country = NL

# Pause after each beacon burst in milliseconds (10 to 5000, default: 50)
# Every SSID is beaconed once per period = (number of SSIDs x burst_gap_ms) + burst_interval_ms,
# and that period is what the beacons advertise as their beacon interval.
burst_interval_ms = 50

# Inter-frame gap between consecutive virtual beacons within a burst (0 to 100, default: 2 ms)
burst_gap_ms = 2

# Active Probe Responder: Replies to 802.11 Probe Requests (1 = enabled, 0 = disabled)
# With 0 the probe still beacons and still logs probes, auth attempts and deauth frames;
# it only stops answering probe requests.
enable_probe_responder = 1

[networks]
# Synthetic targets / honeypot virtual SSIDs (one per line, up to 16, max 32 bytes each)
# Each SSID automatically receives a unique locally-administered BSSID.
IoT-Sensors-Net
IoT-Cameras-Net
IoT-Automation-Net
IoT-Isolated-DMZ
IoT-Guest-Net

[bluetooth]
# Enable Bluetooth multi-identity advertising (1 = enabled, 0 = disabled)
enable_ble = 1

# Bluetooth advertisement dwell / rotation interval in milliseconds (1000 to 10000, default: 2000)
# Each interval, the board switches to the next virtual Bluetooth identity.
# Note: Phones (iOS/Android) scan periodically across RF channels and require
# at least 1500 - 2500 ms dwell time per identity to discover and list all devices.
ble_adv_interval_ms = 2000

# A connected phone or laptop pauses the identity rotation. After this many seconds the
# probe drops the connection and resumes (0 to 3600, default: 30, 0 = never drop).
max_connection_s = 30

# Native OS Bluetooth discovery accessory emulation:
# Standard phone/laptop Bluetooth settings screens ignore generic beacons and only
# display accessories/peripherals. Select which accessory type to emulate:
#   0  = Generic BLE device (Device Information Service 0x180A)
#   1  = Keyboard (HID 0x03C1, Service 0x1812) - Keyboard icon
#   2  = Mouse (HID 0x03C2, Service 0x1812) - Mouse icon
#   3  = Gamepad / Controller (HID 0x03C4, Service 0x1812) - Controller icon
#   4  = Joystick (HID 0x03C3, Service 0x1812) - Joystick icon
#   5  = Remote Control (Appearance 0x0180, Service 0x1812) - Remote icon
#   6  = Smartwatch (Appearance 0x00C2, Service 0x1805) - Watch icon
#   7  = Heart Rate Monitor (Appearance 0x0341, Service 0x180D) - Heart Rate icon
#   8  = Health Thermometer (Appearance 0x0300, Service 0x1809) - Thermometer icon
#   9  = Cycling Sensor (Appearance 0x0485, Service 0x1816) - Bike/Speed icon
#   10 = Digital Pen / Stylus (HID 0x03C7, Service 0x1812) - Pen icon
#   11 = Barcode Scanner (HID 0x03C8, Service 0x1812) - Scanner icon
#   12 = Auto-Distribute Showcase (Each virtual network gets a DIFFERENT accessory icon!)
accessory_type = 12

# Custom Bluetooth device names (one per line, up to 16 names, max 29 bytes each).
# A name that contains '=' must be written as: name = My=Device
# If left commented out or empty, the names mirror the [networks] above ("-BLE" is
# appended when the result still fits in 29 bytes for every name).
# IoT-Sensors-BLE
# IoT-Cameras-BLE
# IoT-Automation-BLE
# IoT-Isolated-BLE
# IoT-Guest-BLE

[led]
# Enable onboard addressable RGB LED indicator on GPIO8 (1 = enabled, 0 = disabled)
# Telemetry events: Idle heartbeat, beacon injection, client probe interrogation, BLE rotation
enable_led = 1

# Global LED brightness percentage (0 to 100, default: 5, linear scale)
# Note: Bare WS2812 diodes without diffusers are piercingly bright!
#   0   = Completely OFF
#   1-5 = Gentle, soft indicator (recommended for desk use)
#   10  = Moderate
#   >20 = Bright / room lighting
brightness = 5