# ============================================================
# PhantomProbe-C6: Wireless RF Security Research & Telemetry Probe
# Target Hardware: ESP32-C6-DevKitC-1 (Wi-Fi 6 / BLE 5 / IEEE 802.15.4)
# ============================================================
# Declarative deployment manifest for multi-BSSID environment simulation,
# wireless honeypot probing, and BLE accessory reconnaissance research.
# Apply changes instantly with: .\flash_firmware.ps1

[wifi]
# Target 2.4 GHz RF Channel (1 to 13)
channel = 1

# Delay between beacon injection cycles in milliseconds (Default: 50 ms)
# Fast injection rates (30-50ms) ensure rapid detection by client WNICs.
burst_interval_ms = 50

# Inter-frame gap between consecutive virtual beacons within a burst (Default: 2 ms)
burst_gap_ms = 2

# Active Probe Responder: Replies to 802.11 Probe Requests (1 = enabled, 0 = disabled)
enable_probe_responder = 1

[networks]
# Synthetic targets / honeypot virtual SSIDs (one per line, max 32 characters each)
# Each SSID automatically receives a unique locally-administered BSSID.
IoT-Sensors-Net
IoT-Cameras-Net
IoT-Automation-Net
IoT-Isolated-DMZ
IoT-Guest-Net

[bluetooth]
# Enable Bluetooth multi-identity advertising (1 = enabled, 0 = disabled)
enable_ble = 1

# Bluetooth advertisement dwell / rotation interval in milliseconds (Default: 2000 ms)
# Each interval, the board switches to the next virtual Bluetooth identity.
# Note: Phones (iOS/Android) scan periodically across RF channels and require
# at least 1500 - 2500 ms dwell time per identity to discover and list all devices.
ble_adv_interval_ms = 2000

# Native OS Bluetooth discovery accessory emulation:
# Standard phone/laptop Bluetooth settings screens ignore generic beacons and only
# display accessories/peripherals. Select which accessory type to emulate:
#   0  = Generic BLE device (Device Information Service 0x180A)
#   1  = Keyboard (HID 0x03C1, Service 0x1812) - Keyboard icon
#   2  = Mouse (HID 0x03C2, Service 0x1812) - Mouse icon
#   3  = Gamepad / Controller (HID 0x03C4, Service 0x1812) - Controller icon
#   4  = Joystick (HID 0x03C3, Service 0x1812) - Joystick icon
#   5  = Remote Control (HID 0x03C8, Service 0x1812) - Remote icon
#   6  = Smartwatch (Appearance 0x00C2, Service 0x1805) - Watch icon
#   7  = Heart Rate Monitor (Appearance 0x0341, Service 0x180D) - Heart Rate icon
#   8  = Health Thermometer (Appearance 0x0300, Service 0x1809) - Thermometer icon
#   9  = Cycling Sensor (Appearance 0x0484, Service 0x1816) - Bike/Speed icon
#   10 = Digital Stylus / Pen (HID 0x03C6, Service 0x1812) - Pen icon
#   11 = Barcode Scanner (HID 0x03C5, Service 0x1812) - Scanner icon
#   12 = Auto-Distribute Showcase (Each virtual network gets a DIFFERENT accessory icon!)
accessory_type = 12

# Custom Bluetooth device names (one per line, up to 16 names).
# If left commented out or empty, it automatically matches the [networks] above!
# IoT-Sensors-BLE
# IoT-Cameras-BLE
# IoT-Automation-BLE
# IoT-Isolated-BLE
# IoT-Guest-BLE

[led]
# Enable onboard addressable RGB LED indicator on GPIO8 (1 = enabled, 0 = disabled)
# Telemetry events: Idle heartbeat, beacon injection, client probe interrogation, BLE rotation
enable_led = 1

# Global LED brightness percentage (0 to 100, default: 5)
# Note: Bare WS2812 diodes without diffusers are piercingly bright!
#   0   = Completely OFF
#   1-5 = Gentle, soft indicator (recommended for desk use)
#   10  = Moderate
#   >20 = Bright / room lighting
brightness = 5